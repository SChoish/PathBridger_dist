[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathbridger"
version = "0.1.0"
description = "PathBridger for offline goal-conditioned reinforcement learning."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "absl-py",
    "flax>=0.8.4",
    "gymnasium>=0.29.1",
    "jax>=0.4.26",
    "ml-collections",
    "numpy>=1.26",
    "ogbench>=1.1.0,<1.3",
    "optax",
    "tqdm",
]

[project.scripts]
pathbridger-train = "main:run"
pathbridger-eval = "evaluate:run"
pathbridger-af-train = "train_af:run"
pathbridger-af-eval = "evaluate_af:run"
pathbridger-af-aggregate = "aggregate_results:run"
pathbridger-pixel-lapo-train = "train_pixel_lapo:run"
pathbridger-pixel-lapo-eval = "evaluate_pixel_lapo:run"
pathbridger-pixel-train = "train_pixel:run"
pathbridger-pixel-eval = "evaluate_pixel:run"

[project.optional-dependencies]
tracking = ["wandb"]
dev = ["pytest", "ruff"]

[tool.setuptools]
py-modules = ["main", "evaluate", "train_af", "evaluate_af", "aggregate_results", "train_pixel_lapo", "evaluate_pixel_lapo", "train_pixel", "evaluate_pixel"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "configs*", "envs*", "utils*"]

[tool.setuptools.data-files]
"share/pathbridger/assets" = ["assets/architecture.jpg"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.format]
quote-style = "single"
