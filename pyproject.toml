[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathbridger-triangleq"
version = "0.1.0"
description = "PBF PathBridger with PathFlower-style triangular chunk-Q."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "absl-py",
    "flax>=0.8.4",
    "gymnasium>=0.29.1",
    "jax>=0.4.26",
    "ml-collections",
    "numpy>=1.26",
    "ogbench==1.1.0",
    "optax",
    "tqdm",
]

[project.scripts]
pathbridger-triangleq-train = "main:run"
pathbridger-triangleq-eval = "evaluate:run"

[project.optional-dependencies]
tracking = ["wandb"]
dev = ["pytest", "ruff"]

[tool.setuptools]
py-modules = ["main", "evaluate"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "configs*", "envs*", "utils*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
